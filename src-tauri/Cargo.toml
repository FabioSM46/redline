[package]
name = "redline"
version = "0.2.1"
description = "Control panel for AMD GPUs on Linux"
authors = ["FabioSM46 <124870035+FabioSM46@users.noreply.github.com>"]
edition = "2024"
license = "MIT"
# The workspace also builds the `redline-probe` binary: without this key `cargo run`
# (and so `pnpm tauri dev`) cannot choose which binary to start.
default-run = "redline"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name.
name = "redline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# D10: the GlobalShortcuts portal. Pinned; async-io, the zbus stack the lockfile already uses.
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
redline-core = { workspace = true }

[workspace]
resolver = "3"
members = [".", "crates/redline-core", "crates/redline-probe"]
# Without default-members, `cargo test` in src-tauri/ would test only the root package:
# this way the CI gates cover the whole workspace.
default-members = [".", "crates/redline-core", "crates/redline-probe"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
redline-core = { path = "crates/redline-core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
