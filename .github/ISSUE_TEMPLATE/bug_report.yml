name: Bug
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Area
      description: Which part of the repository is affected?
      options:
        - backend (Rust / Tauri)
        - frontend (React / TypeScript)
        - shared (Cross-cutting)
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: The observed behavior. Include exact error messages, panics and stack traces.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: The correct behavior, precise enough to derive a test from it.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Ordered steps. The agent tries to reproduce the bug before fixing it.
      placeholder: |
        1. Start the replay with the `default_output` and `default_input` tracks
        2. Save a replay
        3. The saved file has a single audio track instead of two
    validations:
      required: true

  - type: textarea
    id: technical_context
    attributes:
      label: Technical Context
      description: |
        **REQUIRED**. Logs, errors and the code paths involved.
      placeholder: |
        Log:
        ```
        thread 'main' panicked at src-tauri/crates/redline-core/src/recorder.rs:42:18
        ```

        Relevant files:
        - src-tauri/crates/redline-core/src/recorder.rs (panic origin)
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: |
        **REQUIRED**. What this fix must NOT touch.
      placeholder: |
        - Do not change the default container (mkv)
        - Do not touch the lactd client
    validations:
      required: true

  - type: textarea
    id: code_pointers
    attributes:
      label: Code Pointers
      description: |
        `file:line` references to read first. Format `path/to/file.rs:42`.
      placeholder: |
        - src-tauri/crates/redline-core/src/recorder.rs:42 (error origin)
    validations:
      required: false
