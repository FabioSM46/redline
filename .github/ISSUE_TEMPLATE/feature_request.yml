name: Feature
description: Request a feature or an enhancement (structured for AI agents)
title: "[Feature]: "
labels: ["feature", "needs-refinement"]
assignees: []
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Area
      description: Which part of the repository does it touch?
      options:
        - backend (Rust / Tauri)
        - frontend (React / TypeScript)
        - shared (Cross-cutting)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Decides the branch prefix and the commit type
      options:
        - feature (New functionality)
        - enhancement (Improvement to an existing feature)
        - refactor (Restructuring with no behavior change)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is it?
      options:
        - high (Blocks other work)
        - medium (Normal priority)
        - low (Useful but not urgent)
      default: 1
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: In the form "As a [role], I want [goal], so that [reason]". Be precise, the agent reads it literally.
      placeholder: |
        As a gamer with an AMD GPU
        I want to set a custom fan curve
        so that the card stays quiet on the desktop and cool in game
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Conditions verifiable as pass/fail. No vague items like "works well".
      placeholder: |
        - [ ] At least four temperature → speed points can be set
        - [ ] Without `lactd` running the section is disabled with a message saying what to install
        - [ ] An unconfirmed change reverts to the previous values
    validations:
      required: true

  - type: textarea
    id: technical_context
    attributes:
      label: Technical Context
      description: |
        **REQUIRED**. It is the agent's main guide.
        Suggested subsections: Files to modify, Patterns to follow, Constraints.
      placeholder: |
        ### Files to modify
        - src-tauri/crates/redline-core/src/lact.rs (`set_fan_control` request)
        - src-tauri/src/lib.rs (`set_fan_curve` command)
        - src/App.tsx (curve editor)

        ### Patterns to follow
        - Tauri commands return a serializable `Result<T, String>`

        ### Constraints
        - System access only in the backend; GPU changes only through lactd
        - No new dependencies (crates or npm packages) without discussing them
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: |
        **REQUIRED**. What this issue does NOT cover.
        Keeps the agent from doing more than needed.
      placeholder: |
        - Do not implement per-game profiles (separate issue)
        - Do not touch the power limit
    validations:
      required: true

  - type: textarea
    id: code_pointers
    attributes:
      label: Code Pointers
      description: |
        `file:line` references to existing code to read first.
      placeholder: |
        - src-tauri/src/lib.rs:10 (command registration)
        - src-tauri/crates/redline-core/src/lact.rs:30 (request format)
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues, PRs or configuration that must be completed first.
      placeholder: |
        - Requires #12 (lactd client with change confirmation)
    validations:
      required: false

  - type: textarea
    id: test_strategy
    attributes:
      label: Test Strategy
      description: What to test, edge cases and how to verify the result.
      placeholder: |
        - Unit test: the curve is serialized in the format lactd expects
        - Edge case: points not ordered by temperature
    validations:
      required: false
