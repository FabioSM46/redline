name: Funzionalità
description: Richiedi una funzionalità o un miglioramento (strutturata per gli agenti AI)
title: "[Feature]: "
labels: ["feature", "needs-refinement"]
assignees: []
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Area
      description: Quale parte del repository tocca?
      options:
        - backend (Rust / Tauri)
        - frontend (React / TypeScript)
        - shared (Trasversale)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Tipo
      description: Decide il prefisso del branch e il tipo di commit
      options:
        - feature (Nuova funzionalità)
        - enhancement (Miglioramento di una funzionalità esistente)
        - refactor (Ristrutturazione senza cambi di comportamento)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priorità
      description: Quanto è urgente?
      options:
        - high (Blocca altro lavoro)
        - medium (Priorità normale)
        - low (Utile ma non urgente)
      default: 1
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: Nella forma "Come [ruolo], voglio [obiettivo], così che [motivo]". Sii preciso, l'agente la legge alla lettera.
      placeholder: |
        Come giocatore con una GPU AMD
        voglio impostare una curva della ventola personalizzata
        così che la scheda resti silenziosa sul desktop e fresca in gioco
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Criteri di accettazione
      description: Condizioni verificabili come passa/non passa. Niente voci vaghe come "funziona bene".
      placeholder: |
        - [ ] Si possono impostare almeno quattro punti temperatura → velocità
        - [ ] Senza `lactd` attivo la sezione è disattivata con un messaggio che dice cosa installare
        - [ ] Una modifica non confermata torna ai valori precedenti
    validations:
      required: true

  - type: textarea
    id: technical_context
    attributes:
      label: Contesto tecnico
      description: |
        **OBBLIGATORIO**. È la guida principale dell'agente.
        Sottosezioni consigliate: File da modificare, Pattern da seguire, Vincoli.
      placeholder: |
        ### File da modificare
        - src-tauri/crates/redline-core/src/lact.rs (richiesta `set_fan_control`)
        - src-tauri/src/lib.rs (comando `set_fan_curve`)
        - src/App.tsx (editor della curva)

        ### Pattern da seguire
        - I comandi Tauri restituiscono `Result<T, String>` serializzabile

        ### Vincoli
        - Accesso al sistema solo nel backend; modifiche alla GPU solo tramite lactd
        - Nessuna nuova dipendenza (crate o pacchetti npm) senza discuterne
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Fuori scope
      description: |
        **OBBLIGATORIO**. Cosa questa issue NON copre.
        Evita che l'agente faccia più del necessario.
      placeholder: |
        - Non implementare i profili per gioco (issue separata)
        - Non toccare il limite di potenza
    validations:
      required: true

  - type: textarea
    id: code_pointers
    attributes:
      label: Riferimenti nel codice
      description: |
        Riferimenti `file:riga` al codice esistente da leggere per primo.
      placeholder: |
        - src-tauri/src/lib.rs:10 (registrazione dei comandi)
        - src-tauri/crates/redline-core/src/lact.rs:30 (formato delle richieste)
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dipendenze
      description: Issue, PR o configurazioni che devono essere completate prima.
      placeholder: |
        - Richiede #12 (client lactd con conferma delle modifiche)
    validations:
      required: false

  - type: textarea
    id: test_strategy
    attributes:
      label: Strategia di test
      description: Cosa testare, casi limite e come verificare il risultato.
      placeholder: |
        - Unit test: la curva viene serializzata nel formato atteso da lactd
        - Caso limite: punti non ordinati per temperatura
    validations:
      required: false
