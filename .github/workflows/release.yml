name: Release

# Builds the .deb, Arch and Fedora packages for a version tag and attaches them to a DRAFT
# GitHub Release.
# Nothing is published automatically — a human reviews the draft and publishes it.
# Redline is Linux-only: there is no Windows or macOS package.
#
# A tag is accepted only on a commit already on `main`: that commit reached `main`
# through a pull request with a green `ci-gate`, so no package is ever built from
# code that skipped the gates. The `verify` job enforces it before anything builds.
#
# The bundle target comes from tauri.linux.conf.json; `--bundles` repeats it so a
# config change cannot silently produce a different package here.
#
# The package carries the licenses of the crates and npm packages compiled into it:
# scripts/third-party-licenses.py writes src-tauri/target/THIRD-PARTY-LICENSES, and the
# `--config` overlay ships it beside `copyright` in /usr/share/doc/redline. The overlay
# is not read by `cargo build`, so the PR CI does not need the file.
#
# Before the draft, `install-check` installs the package on a clean container of each
# supported system (scripts/deb-clean-install.sh). A failure on any of them stops the draft.
# The images are pinned by tag, not by digest: a clean install has to meet the libraries the
# system ships today, and a digest would freeze them until someone remembers to move it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag points at a commit that is not on main. Tag a commit on main, which has passed ci-gate."
            exit 1
          fi
          echo "Tagged commit is on main."

  linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: |
          bash scripts/apt-install-with-fallback.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect third-party licenses
        run: python3 scripts/third-party-licenses.py --target x86_64-unknown-linux-gnu --output src-tauri/target/THIRD-PARTY-LICENSES
      - name: Build the .deb
        run: pnpm tauri build --bundles deb --config src-tauri/tauri.release.linux.conf.json
      - name: Install the desktop file under the bundle identifier
        run: bash scripts/deb-desktop-id.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Proves the package installs and its libraries resolve, not that the app works: a container
  # has no desktop session, no pkexec agent and no GPU. docs/release.md lists what stays manual.
  install-check:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every system reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-deb
          path: packages
      - name: Install on a clean ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          set -- packages/*.deb
          [ "$#" -eq 1 ] || { echo "::error::Expected one .deb, found $#."; exit 1; }
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/scripts:/check:ro" \
            "$IMAGE" bash /check/deb-clean-install.sh "/$1"

  # The Arch and Fedora packages, each built on its own system so it links that system's libraries.
  distro:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: arch
            image: archlinux:latest
          - system: fedora
            image: fedora:44
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          mkdir packages
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/packages:/out" \
            "$IMAGE" bash /repo/scripts/build-distro-package.sh "$SYSTEM" /repo /out
      - name: Install on a clean ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          set -- packages/*
          [ "$#" -eq 1 ] || { echo "::error::Expected one package, found $#."; exit 1; }
          docker run --rm \
            -v "$PWD/packages:/packages:ro" \
            -v "$PWD/scripts:/check:ro" \
            "$IMAGE" bash /check/distro-clean-install.sh "$SYSTEM" "/$1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.system }}
          path: packages/*
          if-no-files-found: error

  # The only job that can write: it creates the draft release from the package artifacts.
  draft:
    needs: [linux, install-check, distro]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No `name:`: every artifact of the run is downloaded and merged into packages/,
      # which `packages/*` below uploads whole.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l packages
          # A re-run, or a tag moved and pushed again, finds the draft already there:
          # replace its packages. A release that is already published is never touched.
          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace its packages."
              exit 1
            fi
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "Redline $TAG" \
              --notes "Packages for Ubuntu, Debian, Arch and Fedora. Draft to review before publishing."
          fi
